user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream backend {
        server project-backend:3000;   # <-- service name, not network
    }

    server {
        listen 443 ssl;
        server_name api.waste-shark.net;     
        
        ssl_certificate     /etc/ssl/origin.pem;
        ssl_certificate_key /etc/ssl/origin.key;            # "_" matches any host; avoid "localhost" unless you need it

        location / {
            proxy_pass http://backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        server_name api.waste-shark.net;


        # Redirect all HTTP requests to HTTPS
        # 301 converts to GET while 308 persists the method
        return 301 https://$host$request_uri;
    }
}
