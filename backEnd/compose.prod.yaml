services:
    project-backend:
        image: firsttobebear/waste-shark-backend:latest
        pull_policy: always
        restart: always
        expose:
            - "3000"
        environment:
            - MONGODB_USERNAME=${MONGODB_USERNAME}
            - MONGODB_PASSWORD=${MONGODB_PASSWORD}
            - MQTT_USERNAME=${MQTT_USERNAME}
            - MQTT_PASSWORD=${MQTT_PASSWORD}
            - HTTP_PORT=${HTTP_PORT}
            - MQTT_PORT=${MQTT_PORT}
            - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
            - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
            - USE_PRODUCTION_IPS=true
        depends_on:
            - mongo
            - mosquitto-broker
        networks:
            - robot-network
    nginx:
        volumes:
            - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro