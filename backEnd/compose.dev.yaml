services:

    mongo:
        ports:
            - "27017:27017"

    mosquitto-broker:
        volumes:
            - ./mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro
        ports:
            - "1883:1883"

    nginx:
        ports:
            - "80:80"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro